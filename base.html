<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MobiSurvey{% endblock %} | INF232</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Variables ─────────────────────────────────────── */
    :root {
      --bg:       #0D1117;
      --card:     #161B22;
      --border:   #30363D;
      --accent:   #00D68F;
      --accent2:  #00A3FF;
      --danger:   #FF6B6B;
      --text:     #E6EDF3;
      --muted:    #8B949E;
      --radius:   12px;
      --shadow:   0 4px 24px rgba(0,0,0,0.4);
    }

    /* ─── Reset ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Navbar ─────────────────────────────────────────── */
    nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .nav-links { display: flex; gap: 0.5rem; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      padding: 0.4rem 0.75rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      background: rgba(0,214,143,0.1);
      color: var(--accent);
    }

    /* ─── Contenu principal ───────────────────────────────── */
    main {
      flex: 1;
      padding: 1.5rem 1rem 3rem;
      max-width: 960px;
      width: 100%;
      margin: 0 auto;
    }

    /* ─── Carte ──────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    /* ─── Boutons ────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.15s;
      width: 100%;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: var(--accent);
      color: #0D1117;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── Formulaire ─────────────────────────────────────── */
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-group select,
    .form-group input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    .form-group select:focus,
    .form-group input[type="number"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Checkboxes personnalisés */
    .checkbox-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      font-size: 0.9rem;
    }
    .checkbox-item:has(input:checked) {
      border-color: var(--accent);
      background: rgba(0,214,143,0.08);
      color: var(--accent);
    }
    .checkbox-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ─── Barre de progression ───────────────────────────── */
    .progress-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
    }
    .step-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      transition: all 0.3s;
    }
    .step-dot.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #0D1117;
    }
    .step-dot.done {
      border-color: var(--accent);
      color: var(--accent);
    }
    .step-line {
      flex: 1;
      max-width: 60px;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
    }

    /* ─── Alerte erreur ──────────────────────────────────── */
    .alert-error {
      background: rgba(255,107,107,0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
    }

    /* ─── Stat cards (dashboard) ─────────────────────────── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      text-align: center;
    }
    .stat-card .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }
    .stat-card .stat-label {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* ─── Charts ─────────────────────────────────────────── */
    .charts-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    .chart-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 0.5rem;
    }
    .chart-container { width: 100%; height: 320px; }

    /* ─── Utilitaires ────────────────────────────────────── */
    .text-accent  { color: var(--accent); }
    .text-muted   { color: var(--muted); }
    .mt-1 { margin-top: 0.5rem; }
    .mt-2 { margin-top: 1rem; }
    .mt-3 { margin-top: 1.5rem; }
    .text-center { text-align: center; }

    /* ─── Footer ─────────────────────────────────────────── */
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ─── Responsive desktop ─────────────────────────────── */
    @media (min-width: 640px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
      .charts-grid { grid-template-columns: repeat(2, 1fr); }
      .btn { width: auto; min-width: 180px; }
      .form-actions { display: flex; gap: 0.75rem; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

  <nav>
    <a href="{{ url_for('index') }}" class="nav-logo">📱 MobiSurvey</a>
    <div class="nav-links">
      <a href="{{ url_for('etape1') }}" {% if request.endpoint and 'etape' in request.endpoint %}class="active"{% endif %}>
        Formulaire
      </a>
      <a href="{{ url_for('dashboard') }}" {% if request.endpoint == 'dashboard' %}class="active"{% endif %}>
        Dashboard
      </a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    INF232 — Analyse de données &nbsp;|&nbsp; Université de Yaoundé I &nbsp;|&nbsp; 2024-2025
  </footer>

</body>
</html>
